name: Deploy Backend to EC2 (Symlink & PM2 Ecosystem)

on:
  push:
    tags:
      - 'backend@*'
      - 'apps-backend@*'
      - 'bookmystudio-server@*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      action:
        type: choice
        description: 'Select deployment action'
        options:
          - deploy
          - rollback
        default: deploy
      target_tag:
        type: string
        description: 'Enter existing tag to rollback to (e.g., v1.0.1)'
        required: false

env:
  APP_DIR: /home/ubuntu/apps/${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version Target
        id: vars
        run: |
          if [ "${{ github.event.inputs.action }}" == "rollback" ]; then
            if [ -z "${{ github.event.inputs.target_tag }}" ]; then
              echo "Error: target_tag required for rollback" && exit 1
            fi
            echo "TAG=${{ github.event.inputs.target_tag }}" >> $GITHUB_OUTPUT
            echo "IS_ROLLBACK=true" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.event.inputs.target_tag }}"
            if [ -z "$TAG" ]; then
              TAG="${GITHUB_REF_NAME}"
            fi
            echo "TAG=${TAG}" >> $GITHUB_OUTPUT
            echo "IS_ROLLBACK=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node & PNPM
        if: steps.vars.outputs.IS_ROLLBACK == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup Node.js
        if: steps.vars.outputs.IS_ROLLBACK == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies & Build
        if: steps.vars.outputs.IS_ROLLBACK == 'false'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter bookmystudio-server build
          pnpm --filter bookmystudio-server --prod deploy --legacy ./bundle
          if [ -d "server/dist" ] && [ ! -d "bundle/dist" ]; then
            cp -r server/dist bundle/dist
          fi 

      - name: Copy Bundle to EC2 Release Folder
        if: steps.vars.outputs.IS_ROLLBACK == 'false'
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ubuntu
          SOURCE: "bundle/"
          TARGET: "${{ env.APP_DIR }}/releases/${{ steps.vars.outputs.TAG }}"
          EXCLUDE: ".git*, node_modules/.cache"

      - name: Link Shared Env, Atomically Swap Symlink & Start/Reload PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            TARGET="${{ env.APP_DIR }}/releases/${{ steps.vars.outputs.TAG }}"

            if [ ! -d "$TARGET" ]; then
              echo "Error: Release directory $TARGET does not exist!"
              exit 1
            fi

            # 1. Symlink persistent environment variables into the target release and app root
            ln -sf "${{ env.APP_DIR }}/shared/.env" "$TARGET/.env"
            ln -sf "${{ env.APP_DIR }}/shared/.env" "${{ env.APP_DIR }}/.env"

            # 2. Atomic symlink switch
            ln -sfn "$TARGET" "${{ env.APP_DIR }}/current_tmp"
            mv -Tf "${{ env.APP_DIR }}/current_tmp" "${{ env.APP_DIR }}/current"

            # 3. Reload existing process or start fresh using ecosystem file
            pm2 startOrReload "${{ env.APP_DIR }}/ecosystem.config.js" --update-env
            pm2 save

            # 4. Retention Policy: Retain only the 5 most recent release directories
            cd "${{ env.APP_DIR }}/releases"
            ls -dt */ | tail -n +6 | xargs -r rm -rf
