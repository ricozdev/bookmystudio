name: Deploy Apps to Vercel

on:
    push:
        branches:
            - main
            - develop
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deploy:
        name: Deploy apps to Vercel
        runs-on: ubuntu-latest

        env:
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            CI: "1"
            TURBO_TELEMETRY_DISABLED: "1"
            NEXT_TELEMETRY_DISABLED: "1"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.26.0
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Deploy all Vercel apps
              shell: bash
              run: |
                  set -euo pipefail

                  REPO_NAME="${GITHUB_REPOSITORY##*/}"

                  echo "=========================================="
                  echo "Repository : ${REPO_NAME}"
                  echo "Vercel Org : ${VERCEL_ORG_ID}"
                  echo "=========================================="

                  # Discover deployable targets: apps/* if existing, otherwise project root
                  DEPLOY_TARGETS=()
                  if [ -d "apps" ] && [ "$(find apps -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)" -gt 0 ]; then
                    for d in apps/*; do
                      [ -d "$d" ] && [ -f "$d/package.json" ] && DEPLOY_TARGETS+=("$d")
                    done
                  fi

                  # Fallback to root directory if no apps/ found
                  if [ "${#DEPLOY_TARGETS[@]}" -eq 0 ]; then
                    DEPLOY_TARGETS=(".")
                  fi

                  for APP_DIR in "${DEPLOY_TARGETS[@]}"; do
                    PACKAGE_JSON="${APP_DIR}/package.json"
                    if [ ! -f "${PACKAGE_JSON}" ]; then
                      continue
                    fi

                    if [ "${APP_DIR}" = "." ]; then
                      APP_NAME="${REPO_NAME}"
                    else
                      APP_NAME="$(basename "${APP_DIR}")"
                    fi

                    # Backend and templates are skipped for Vercel
                    if [ "${APP_NAME}" = "backend" ] || [ "${APP_NAME}" = "server" ] || [ "${APP_NAME}" = "bookmystudio-server" ]; then
                      echo "⏭️  Skipping backend directory ${APP_DIR}"
                      continue
                    fi

                    if [ "${APP_NAME}" = "next" ] || [ "${APP_NAME}" = "vite" ]; then
                      echo "⏭️  Skipping template directory ${APP_DIR}"
                      continue
                    fi

                    # Resolve Vercel project name
                    if [ "${APP_DIR}" = "." ]; then
                      VERCEL_PROJECT_NAME="${REPO_NAME}"
                    elif [[ "${APP_NAME}" == *_default || "${APP_NAME}" == *-default ]]; then
                      VERCEL_PROJECT_NAME="${REPO_NAME}"
                    else
                      VERCEL_PROJECT_NAME="${APP_NAME}"
                    fi

                    # Read package metadata
                    PACKAGE_NAME="$(jq -r '.name // empty' "${PACKAGE_JSON}")"
                    if [ -z "${PACKAGE_NAME}" ]; then
                      echo "❌ package.json has no \"name\": ${PACKAGE_JSON}"
                      exit 1
                    fi

                    # Detect framework
                    FRAMEWORK="$(jq -r '
                      if (.dependencies.next // .devDependencies.next // .peerDependencies.next) then
                        "nextjs"
                      elif (.dependencies.vite // .devDependencies.vite // .peerDependencies.vite) then
                        "vite"
                      elif .vercel.framework then
                        .vercel.framework
                      else
                        ""
                      end
                    ' "${PACKAGE_JSON}")"

                    if [ -z "${FRAMEWORK}" ]; then
                      echo "❌ Unable to detect framework for ${APP_DIR} (${PACKAGE_NAME})"
                      exit 1
                    fi

                    # Resolve build command and root directory
                    if [ "${APP_DIR}" = "." ]; then
                      ROOT_DIR=""
                      BUILD_COMMAND="pnpm run build"
                    else
                      ROOT_DIR="${APP_DIR}"
                      BUILD_COMMAND="pnpm run build"
                    fi

                    echo ""
                    echo "=========================================="
                    echo "Application    : ${APP_DIR}"
                    echo "Package        : ${PACKAGE_NAME}"
                    echo "Framework      : ${FRAMEWORK}"
                    echo "Vercel Project : ${VERCEL_PROJECT_NAME}"
                    echo "Build Command  : ${BUILD_COMMAND}"
                    echo "=========================================="

                    # Resolve existing Vercel project ID or dynamically create if needed
                    CLEAN_PROJECT_NAME="$(echo "${VERCEL_PROJECT_NAME}" | tr '[:upper:]' '[:lower:]' | tr '_' '-' | tr -cd 'a-z0-9.-')"
                    CANDIDATE_NAMES=("${VERCEL_PROJECT_NAME}" "${CLEAN_PROJECT_NAME}" "${PACKAGE_NAME}" "bookmystudio")

                    VERCEL_PROJECT_ID=""
                    RESOLVED_PROJECT_NAME=""

                    for CANDIDATE in "${CANDIDATE_NAMES[@]}"; do
                      [ -z "$CANDIDATE" ] && continue
                      PROJECT_RESPONSE="$(
                        curl \
                          --silent \
                          --get \
                          "https://api.vercel.com/v9/projects/${CANDIDATE}" \
                          -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                          -H "Content-Type: application/json" \
                          ${VERCEL_ORG_ID:+--data-urlencode "teamId=${VERCEL_ORG_ID}"} 2>/dev/null || true
                      )"

                      FOUND_ID="$(echo "${PROJECT_RESPONSE}" | jq -r '.id // empty' 2>/dev/null || true)"
                      if [ -n "${FOUND_ID}" ]; then
                        VERCEL_PROJECT_ID="${FOUND_ID}"
                        RESOLVED_PROJECT_NAME="${CANDIDATE}"
                        break
                      fi
                    done

                    if [ -z "${VERCEL_PROJECT_ID}" ]; then
                      echo "Project not found, creating new project '${CLEAN_PROJECT_NAME}' on Vercel..."
                      CREATE_PAYLOAD="$(jq -n --arg name "${CLEAN_PROJECT_NAME}" --arg framework "${FRAMEWORK}" '{name: $name, framework: $framework}')"
                      CREATE_RESPONSE="$(
                        curl \
                          --silent \
                          -X POST \
                          "https://api.vercel.com/v10/projects${VERCEL_ORG_ID:+?teamId=${VERCEL_ORG_ID}}" \
                          -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                          -H "Content-Type: application/json" \
                          -d "${CREATE_PAYLOAD}"
                      )"
                      VERCEL_PROJECT_ID="$(echo "${CREATE_RESPONSE}" | jq -r '.id // empty')"
                      RESOLVED_PROJECT_NAME="${CLEAN_PROJECT_NAME}"
                    fi

                    if [ -z "${VERCEL_PROJECT_ID}" ]; then
                      echo "❌ Vercel project not found and could not be created for ${VERCEL_PROJECT_NAME}"
                      exit 1
                    fi

                    echo "Project ID: ${VERCEL_PROJECT_ID} (${RESOLVED_PROJECT_NAME})"

                    # Clean Vercel state from previous app
                    rm -rf .vercel
                    rm -f .env.local .env.production.local .env.preview.local

                    export VERCEL_PROJECT_ID="${VERCEL_PROJECT_ID}"
                    export VERCEL_ORG_ID="${VERCEL_ORG_ID}"

                    # Pull production environment variables + project settings
                    echo ""
                    echo "Pulling Vercel project settings..."

                    pnpm dlx vercel@latest pull \
                      --yes \
                      --environment=production \
                      --token="${VERCEL_TOKEN}"

                    if [ ! -f ".vercel/project.json" ]; then
                      echo "❌ .vercel/project.json was not created"
                      exit 1
                    fi

                    # Override local Vercel configuration
                    echo "Applying temporary local Vercel configuration..."
                    tmp_project_json="$(mktemp)"

                    if [ -n "${ROOT_DIR}" ]; then
                      jq \
                        --arg rootDirectory "${ROOT_DIR}" \
                        --arg framework "${FRAMEWORK}" \
                        --arg buildCommand "${BUILD_COMMAND}" \
                        '
                          .settings.rootDirectory = $rootDirectory
                          | .settings.framework = $framework
                          | .settings.buildCommand = $buildCommand
                        ' .vercel/project.json > "${tmp_project_json}"
                    else
                      jq \
                        --arg framework "${FRAMEWORK}" \
                        --arg buildCommand "${BUILD_COMMAND}" \
                        '
                          .settings.rootDirectory = null
                          | .settings.framework = $framework
                          | .settings.buildCommand = $buildCommand
                        ' .vercel/project.json > "${tmp_project_json}"
                    fi

                    mv "${tmp_project_json}" .vercel/project.json

                    echo "Local Vercel configuration:"
                    jq '{
                      projectId,
                      orgId,
                      settings: {
                        framework,
                        buildCommand,
                        rootDirectory,
                        nodeVersion
                      }
                    }' .vercel/project.json

                    # Build using Vercel Build Output API
                    echo ""
                    echo "=========================================="
                    echo "Building ${APP_DIR} (${RESOLVED_PROJECT_NAME})"
                    echo "Framework: ${FRAMEWORK}"
                    echo "=========================================="

                    timeout 1800 pnpm dlx vercel@latest build \
                      --prod \
                      --yes \
                      --token="${VERCEL_TOKEN}"

                    if [ ! -d ".vercel/output" ]; then
                      echo "❌ Vercel build output was not generated in .vercel/output"
                      exit 1
                    fi

                    echo "✅ Build output generated"

                    # Deploy prebuilt Vercel output
                    echo ""
                    echo "=========================================="
                    echo "Deploying ${APP_DIR} (${RESOLVED_PROJECT_NAME})"
                    echo "Framework: ${FRAMEWORK}"
                    echo "=========================================="

                    DEPLOYMENT_URL="$(
                      timeout 900 pnpm dlx vercel@latest deploy \
                        --prebuilt \
                        --prod \
                        --yes \
                        --token="${VERCEL_TOKEN}"
                    )"

                    echo "✅ Deployment successful"
                    echo "   App:       ${APP_DIR}"
                    echo "   Framework: ${FRAMEWORK}"
                    echo "   Project:   ${RESOLVED_PROJECT_NAME}"
                    echo "   URL:       ${DEPLOYMENT_URL}"

                    # Clean temporary Vercel state before next application
                    rm -rf .vercel
                    rm -f .env.local .env.production.local .env.preview.local
                    unset VERCEL_PROJECT_ID

                    echo "✅ Finished ${APP_DIR}"
                  done
