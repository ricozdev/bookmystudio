<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="brickWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="warehouseFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#brickWall)"/>

  <!-- Brick Texture Lines -->
  <g stroke="#431407" stroke-width="1.5" opacity="0.4">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
  </g>

  <!-- Heavy Timber Ceiling Trusses -->
  <g stroke="#291206" stroke-width="6">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <!-- Diagonal cross braces -->
    <line x1="80" y1="50" x2="140" y2="90"/>
    <line x1="200" y1="50" x2="260" y2="90"/>
    <line x1="320" y1="50" x2="380" y2="90"/>
    <line x1="440" y1="50" x2="500" y2="90"/>
    <line x1="560" y1="50" x2="620" y2="90"/>
    <line x1="680" y1="50" x2="740" y2="90"/>
  </g>

  <!-- Two Large Industrial Steel Sash Windows -->
  <g transform="translate(140, 80)">
    <rect width="200" height="170" fill="url(#windowLight)" stroke="#090d16" stroke-width="4"/>
    <line x1="66" y1="0" x2="66" y2="170" stroke="#090d16" stroke-width="3"/>
    <line x1="133" y1="0" x2="133" y2="170" stroke="#090d16" stroke-width="3"/>
    <line x1="0" y1="42" x2="200" y2="42" stroke="#090d16" stroke-width="3"/>
    <line x1="0" y1="85" x2="200" y2="85" stroke="#090d16" stroke-width="3"/>
    <line x1="0" y1="128" x2="200" y2="128" stroke="#090d16" stroke-width="3"/>
  </g>

  <g transform="translate(460, 80)">
    <rect width="200" height="170" fill="url(#windowLight)" stroke="#090d16" stroke-width="4"/>
    <line x1="66" y1="0" x2="66" y2="170" stroke="#090d16" stroke-width="3"/>
    <line x1="133" y1="0" x2="133" y2="170" stroke="#090d16" stroke-width="3"/>
    <line x1="0" y1="42" x2="200" y2="42" stroke="#090d16" stroke-width="3"/>
    <line x1="0" y1="85" x2="200" y2="85" stroke="#090d16" stroke-width="3"/>
    <line x1="0" y1="128" x2="200" y2="128" stroke="#090d16" stroke-width="3"/>
  </g>

  <!-- Polished Industrial Concrete Floor -->
  <polygon points="0,270 800,270 800,500 0,500" fill="url(#warehouseFloor)"/>
  <ellipse cx="240" cy="380" rx="140" ry="40" fill="#f8fafc" opacity="0.18"/>
  <ellipse cx="560" cy="380" rx="140" ry="40" fill="#f8fafc" opacity="0.18"/>

  <!-- Left Industrial Rollup Door Frame -->
  <rect x="30" y="160" width="70" height="150" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
  <line x1="30" y1="190" x2="100" y2="190" stroke="#475569" stroke-width="2"/>
  <line x1="30" y1="220" x2="100" y2="220" stroke="#475569" stroke-width="2"/>
  <line x1="30" y1="250" x2="100" y2="250" stroke="#475569" stroke-width="2"/>

  <!-- Spec Label -->
  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#cbd5e1">BUSHWICK · 6,500 SQ FT ORIGINAL BRICK WAREHOUSE · 24FT TIMBER BEAMS</text>
</svg>

