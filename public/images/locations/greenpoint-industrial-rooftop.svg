<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rooftopSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="gravelRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#rooftopSky)"/>

  <!-- Manhattan Skyline Across the River -->
  <g fill="#0f172a" opacity="0.85">
    <polygon points="120,290 120,180 150,180 150,290"/>
    <polygon points="160,290 160,140 190,140 195,110 200,140 200,290"/>
    <polygon points="210,290 210,210 240,210 240,290"/>
    <polygon points="250,290 250,150 290,150 290,290"/>
    <polygon points="310,290 310,90 325,40 340,90 350,290"/>
    <polygon points="360,290 360,170 395,170 395,290"/>
    <polygon points="410,290 410,130 440,130 440,290"/>
    <polygon points="460,290 460,200 490,200 490,290"/>
    <polygon points="510,290 510,160 550,160 550,290"/>
    <polygon points="570,290 570,180 610,180 610,290"/>
  </g>

  <!-- Rooftop Parapet Wall & Industrial Water Tower -->
  <!-- Water Tower on Right -->
  <g transform="translate(640, 160)">
    <!-- Steel Legs -->
    <line x1="20" y1="130" x2="40" y2="60" stroke="#020617" stroke-width="3"/>
    <line x1="80" y1="130" x2="60" y2="60" stroke="#020617" stroke-width="3"/>
    <line x1="25" y1="100" x2="75" y2="100" stroke="#020617" stroke-width="2"/>
    <!-- Cedar Barrel Body -->
    <rect x="30" y="0" width="40" height="60" rx="2" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <line x1="30" y1="15" x2="70" y2="15" stroke="#18181b" stroke-width="1.5"/>
    <line x1="30" y1="35" x2="70" y2="35" stroke="#18181b" stroke-width="1.5"/>
    <!-- Conical Roof -->
    <polygon points="25,0 50,-25 75,0" fill="#451a03"/>
  </g>

  <!-- Low Parapet Brick Ledge -->
  <rect x="0" y="280" width="800" height="25" fill="#7f1d1d" stroke="#450a0a" stroke-width="2"/>
  <rect x="0" y="278" width="800" height="6" fill="#991b1b"/>

  <!-- Gravel Rooftop Surface Foreground -->
  <polygon points="0,305 800,305 800,500 0,500" fill="url(#gravelRoof)"/>
  
  <!-- Safety Railing Stanchions -->
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="40" y1="240" x2="40" y2="280"/>
    <line x1="180" y1="240" x2="180" y2="280"/>
    <line x1="320" y1="240" x2="320" y2="280"/>
    <line x1="460" y1="240" x2="460" y2="280"/>
    <line x1="600" y1="240" x2="600" y2="280"/>
    <line x1="0" y1="245" x2="800" y2="245"/>
    <line x1="0" y1="262" x2="800" y2="262"/>
  </g>

  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#f8fafc">GREENPOINT ROOFTOP · 8,000 SQ FT GRAVEL DECK · 360° SKYLINE PANORAMA</text>
</svg>

