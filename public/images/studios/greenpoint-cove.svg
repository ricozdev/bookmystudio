<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e35"/>
      <stop offset="60%" stop-color="#1f2329"/>
      <stop offset="100%" stop-color="#181a1f"/>
    </linearGradient>
    <linearGradient id="cycCove" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#eef2f6"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="softLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cycSpot" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#e2e8f0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Studio Wall Background -->
  <rect width="800" height="500" fill="url(#bgWall)"/>

  <!-- Industrial Ceiling Beams & Rigging Grid -->
  <g stroke="#334155" stroke-width="3" opacity="0.7">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="80" y1="0" x2="80" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="150"/>
    <line x1="320" y1="0" x2="320" y2="150"/>
    <line x1="440" y1="0" x2="440" y2="150"/>
    <line x1="560" y1="0" x2="560" y2="150"/>
    <line x1="680" y1="0" x2="680" y2="150"/>
  </g>

  <!-- Factory Sash Skylights & Daylight Windows (Upper Left) -->
  <g opacity="0.35">
    <rect x="40" y="20" width="120" height="70" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <line x1="100" y1="20" x2="100" y2="90" stroke="#475569" stroke-width="2"/>
    <line x1="40" y1="55" x2="160" y2="55" stroke="#475569" stroke-width="2"/>

    <rect x="180" y="20" width="120" height="70" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <line x1="240" y1="20" x2="240" y2="90" stroke="#475569" stroke-width="2"/>
    <line x1="180" y1="55" x2="300" y2="55" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- The Seamless Cyclorama Floor and Curved Cove -->
  <path d="M 0,220 C 180,210 620,210 800,220 L 800,500 L 0,500 Z" fill="url(#cycCove)"/>
  
  <!-- Cyc Light Spot Pool -->
  <ellipse cx="400" cy="380" rx="340" ry="110" fill="url(#cycSpot)"/>

  <!-- Cove Curve Shadow Boundary -->
  <path d="M 0,230 Q 400,285 800,230" stroke="#94a3b8" stroke-width="12" fill="none" opacity="0.35"/>
  <path d="M 0,235 Q 400,290 800,235" stroke="#cbd5e1" stroke-width="24" fill="none" opacity="0.4"/>

  <!-- Left Studio Light Stand & Octabox Softbox -->
  <g transform="translate(130, 160)">
    <!-- Stand Base and Wheels -->
    <path d="M -30,220 L 0,200 L 30,220" stroke="#0f172a" stroke-width="4" fill="none"/>
    <circle cx="-30" cy="222" r="4" fill="#0f172a"/>
    <circle cx="30" cy="222" r="4" fill="#0f172a"/>
    <line x1="0" y1="200" x2="0" y2="40" stroke="#334155" stroke-width="5"/>
    <circle cx="0" cy="110" r="5" fill="#475569"/>
    <!-- Extension Arm & Knuckles -->
    <line x1="0" y1="50" x2="45" y2="10" stroke="#334155" stroke-width="4"/>
    <!-- Octabox -->
    <polygon points="45,10 85,-20 120,5 115,50 75,70 45,35" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <polygon points="45,10 85,-20 120,5 115,50 75,70 45,35" fill="url(#softLight)" opacity="0.85"/>
  </g>

  <!-- Right Studio C-Stand and Flag / Reflector -->
  <g transform="translate(640, 170)">
    <!-- Turtle Base -->
    <path d="M -25,210 L 0,195 L 25,210" stroke="#0f172a" stroke-width="3" fill="none"/>
    <line x1="0" y1="195" x2="0" y2="30" stroke="#334155" stroke-width="4"/>
    <!-- Grip Head & Gobo Arm with Black Solid Flag -->
    <line x1="0" y1="60" x2="-35" y2="20" stroke="#475569" stroke-width="3"/>
    <rect x="-85" y="0" width="50" height="75" rx="3" fill="#020617" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Subtle Studio Label Tag at bottom -->
  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748b">STAGE A · 4,200 SQ FT CYCLORAMA COVE</text>
</svg>

