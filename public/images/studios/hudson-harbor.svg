<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="harborSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="harborWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="studioFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Studio Ceiling & Ambient -->
  <rect width="800" height="500" fill="#0f172a"/>

  <!-- Floor to Ceiling Glass Window Wall Across Full Width -->
  <rect x="20" y="20" width="760" height="280" fill="url(#harborSky)"/>

  <!-- Distant Manhattan Skyline & Harbor Horizon through Windows -->
  <rect x="20" y="190" width="760" height="110" fill="url(#harborWater)"/>
  <!-- Distant Cargo Ships & Pier Cranes -->
  <polygon points="140,185 180,185 195,195 125,195" fill="#334155"/>
  <rect x="155" y="170" width="10" height="15" fill="#475569"/>
  <!-- Skyline Silhouettes -->
  <polygon points="340,195 340,150 365,150 365,195" fill="#94a3b8" opacity="0.6"/>
  <polygon points="370,195 370,130 395,130 405,115 415,130 415,195" fill="#94a3b8" opacity="0.6"/>
  <polygon points="420,195 420,160 450,160 450,195" fill="#94a3b8" opacity="0.6"/>

  <!-- Steel Mullions & Architectural Window Grid (80% Glass) -->
  <g stroke="#1e293b" stroke-width="4">
    <!-- Horizontal Mullions -->
    <line x1="20" y1="20" x2="780" y2="20"/>
    <line x1="20" y1="110" x2="780" y2="110"/>
    <line x1="20" y1="200" x2="780" y2="200"/>
    <line x1="20" y1="300" x2="780" y2="300"/>
    <!-- Vertical Mullions -->
    <line x1="20" y1="20" x2="20" y2="300"/>
    <line x1="140" y1="20" x2="140" y2="300"/>
    <line x1="260" y1="20" x2="260" y2="300"/>
    <line x1="380" y1="20" x2="380" y2="300"/>
    <line x1="500" y1="20" x2="500" y2="300"/>
    <line x1="620" y1="20" x2="620" y2="300"/>
    <line x1="740" y1="20" x2="740" y2="300"/>
    <line x1="780" y1="20" x2="780" y2="300"/>
  </g>

  <!-- Dual Wraparound Cyclorama Floor -->
  <polygon points="0,300 800,300 800,500 0,500" fill="url(#studioFloor)"/>
  
  <!-- Subtle Cove Curve Line on Floor -->
  <path d="M 0,310 Q 400,345 800,310" stroke="#cbd5e1" stroke-width="6" fill="none"/>

  <!-- Overhead Motorized Scrim / Diffusion Panel -->
  <polygon points="120,40 680,40 730,70 70,70" fill="#ffffff" opacity="0.75" stroke="#94a3b8" stroke-width="2"/>

  <!-- Spec Label Tag -->
  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#475569">CHELSEA HARBOR · 5,200 SQ FT · 80% GLASS WALLS · DUAL CYC</text>
</svg>

