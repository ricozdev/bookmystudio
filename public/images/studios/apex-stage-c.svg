<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="soundstageDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="floorReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="skypanelGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skypanelGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Soundstage Background -->
  <rect width="800" height="500" fill="url(#soundstageDark)"/>

  <!-- Acoustic Padded Wall Treatment (Sound baffles pattern) -->
  <g opacity="0.15" stroke="#475569" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
    <!-- Vertical Acoustic Panels -->
    <rect x="30" y="80" width="60" height="180" fill="#1e293b"/>
    <rect x="110" y="80" width="60" height="180" fill="#1e293b"/>
    <rect x="630" y="80" width="60" height="180" fill="#1e293b"/>
    <rect x="710" y="80" width="60" height="180" fill="#1e293b"/>
  </g>

  <!-- Overhead Heavy Duty Box Truss Rigging Grid (28ft high) -->
  <g stroke="#64748b" stroke-width="2.5" opacity="0.85">
    <!-- Main Horizontal Box Truss Top & Bottom Rails -->
    <line x1="40" y1="50" x2="760" y2="50" stroke-width="4"/>
    <line x1="40" y1="85" x2="760" y2="85" stroke-width="4"/>
    <!-- Diagonal Truss Webbing -->
    <path d="M 40,50 L 70,85 L 100,50 L 130,85 L 160,50 L 190,85 L 220,50 L 250,85 L 280,50 L 310,85 L 340,50 L 370,85 L 400,50 L 430,85 L 460,50 L 490,85 L 520,50 L 550,85 L 580,50 L 610,85 L 640,50 L 670,85 L 700,50 L 730,85 L 760,50" fill="none"/>
    <!-- Chain Motor Hoists -->
    <rect x="160" y="20" width="22" height="30" fill="#334155"/>
    <line x1="171" y1="0" x2="171" y2="20" stroke="#94a3b8" stroke-width="2"/>
    <rect x="600" y="20" width="22" height="30" fill="#334155"/>
    <line x1="611" y1="0" x2="611" y2="20" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Hanging ARRI SkyPanels / Kinoflo Units on Truss -->
  <!-- Unit 1: 5600K Daylight Blue glow -->
  <ellipse cx="260" cy="160" rx="160" ry="80" fill="url(#skypanelGlow1)"/>
  <rect x="220" y="85" width="80" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="224" y="89" width="72" height="16" fill="#e0f2fe"/>

  <!-- Unit 2: 3200K Tungsten Warm glow -->
  <ellipse cx="520" cy="170" rx="160" ry="80" fill="url(#skypanelGlow2)"/>
  <rect x="480" y="85" width="80" height="24" rx="2" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <rect x="484" y="89" width="72" height="16" fill="#fef3c7"/>

  <!-- Soundstage Painted Black Concrete Floor -->
  <polygon points="0,290 800,290 800,500 0,500" fill="url(#floorReflection)"/>
  <line x1="0" y1="290" x2="800" y2="290" stroke="#334155" stroke-width="2"/>

  <!-- Floor Reflections of Truss & Overhead Lights -->
  <ellipse cx="260" cy="360" rx="110" ry="25" fill="#38bdf8" opacity="0.18"/>
  <ellipse cx="520" cy="370" rx="110" ry="25" fill="#fbbf24" opacity="0.15"/>

  <!-- Camera Rig on Dolly & Video Village Monitor in Center -->
  <g transform="translate(370, 240)">
    <!-- Dolly Track / Base -->
    <rect x="-40" y="110" width="100" height="10" rx="2" fill="#020617" stroke="#475569" stroke-width="1.5"/>
    <circle cx="-25" cy="125" r="8" fill="#334155"/>
    <circle cx="45" cy="125" r="8" fill="#334155"/>
    <!-- Pedestal Column -->
    <rect x="-5" y="50" width="25" height="65" fill="#1e293b"/>
    <!-- Camera Body & Matte Box -->
    <rect x="-10" y="25" width="45" height="30" rx="3" fill="#020617" stroke="#64748b" stroke-width="1.5"/>
    <polygon points="35,22 65,15 65,58 35,50" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
    <!-- Onboard Monitor (with active green tally light) -->
    <rect x="-25" y="12" width="22" height="16" rx="1" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
    <rect x="-23" y="14" width="18" height="12" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- Technical Spec Watermark -->
  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748b">STAGE C · STC 64 CERTIFIED SOUNDSTAGE · 600A CAMLOCK</text>
</svg>

