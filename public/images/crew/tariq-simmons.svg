<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="crewBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="audioMeterGlow" cx="50%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#crewBg3)"/>
  <!-- Ambient Audio Meter Glow in lower half -->
  <circle cx="200" cy="350" r="130" fill="url(#audioMeterGlow)"/>

  <!-- Background Soundstage Acoustics -->
  <line x1="60" y1="0" x2="60" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="340" y1="0" x2="340" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Professional Over-Ear Studio Monitor Headphones (Sony MDR-7506) on head -->
  <path d="M 145,120 Q 200,60 255,120" stroke="#090d16" stroke-width="12" fill="none"/>
  <!-- Left & Right Ear Cups -->
  <ellipse cx="145" cy="135" rx="14" ry="24" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <ellipse cx="255" cy="135" rx="14" ry="24" fill="#0f172a" stroke="#475569" stroke-width="2"/>

  <!-- Head & Facial Features: Tariq Simmons -->
  <ellipse cx="200" cy="140" rx="42" ry="50" fill="#78350f"/>
  <!-- Short hair / fade -->
  <path d="M 158,125 C 160,88 240,88 242,125 C 240,98 225,92 200,92 C 175,92 160,98 158,125 Z" fill="#020617"/>

  <!-- Eyes & Eyebrows -->
  <ellipse cx="185" cy="138" rx="4" ry="2.5" fill="#18181b"/>
  <ellipse cx="215" cy="138" rx="4" ry="2.5" fill="#18181b"/>
  <line x1="178" y1="130" x2="192" y2="131" stroke="#020617" stroke-width="2"/>
  <line x1="208" y1="131" x2="222" y2="130" stroke="#020617" stroke-width="2"/>
  <path d="M 200,140 L 197,152 L 204,152" stroke="#451a03" stroke-width="2" fill="none"/>
  <!-- Neat Beard / Goatee -->
  <path d="M 188,162 Q 200,166 212,162 Q 208,180 200,180 Q 192,180 188,162 Z" fill="#090d16"/>

  <!-- Neck & Production Hoodie -->
  <rect x="180" y="180" width="40" height="40" fill="#58290a"/>
  <!-- Shoulders & Dark Technical Vest -->
  <path d="M 60,400 L 95,250 L 160,215 L 240,215 L 305,250 L 340,400 Z" fill="#111827" stroke="#334155" stroke-width="2"/>

  <!-- Orca / K-Tek Sound Harness Straps Across Chest -->
  <line x1="120" y1="230" x2="160" y2="300" stroke="#e11d48" stroke-width="6"/>
  <line x1="280" y1="230" x2="240" y2="300" stroke="#e11d48" stroke-width="6"/>
  <circle cx="160" cy="300" r="7" fill="#64748b"/>
  <circle cx="240" cy="300" r="7" fill="#64748b"/>

  <!-- Sound Devices 833 / Wisycom Sound Bag in Lower Front -->
  <g transform="translate(110, 290)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
    <!-- Clear window & LED VU Meters (Green, Yellow, Red) -->
    <rect x="15" y="15" width="150" height="45" rx="3" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <!-- Active Green Level Meters -->
    <rect x="25" y="22" width="85" height="5" fill="#22c55e"/>
    <rect x="112" y="22" width="20" height="5" fill="#eab308"/>
    <rect x="25" y="32" width="75" height="5" fill="#22c55e"/>
    <rect x="102" y="32" width="15" height="5" fill="#eab308"/>
    <rect x="25" y="42" width="90" height="5" fill="#22c55e"/>
    <rect x="117" y="42" width="10" height="5" fill="#eab308"/>
    <!-- Rotary Gain Pots / Dials -->
    <circle cx="45" cy="80" r="10" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="85" cy="80" r="10" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="125" cy="80" r="10" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Wireless Receiver SMA Whip Antennas extending up -->
    <line x1="165" y1="0" x2="175" y2="-35" stroke="#94a3b8" stroke-width="2"/>
    <line x1="15" y1="0" x2="5" y2="-35" stroke="#94a3b8" stroke-width="2"/>
  </g>
</svg>

