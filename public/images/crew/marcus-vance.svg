<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="crewBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="monitorGlow" cx="30%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#crewBg2)"/>

  <!-- Monitor glow on set -->
  <circle cx="120" cy="240" r="160" fill="url(#monitorGlow)"/>

  <!-- Studio background set pieces -->
  <line x1="0" y1="280" x2="400" y2="280" stroke="#1e293b" stroke-width="2"/>
  <rect x="20" y="80" width="80" height="180" fill="#090d16" stroke="#1e293b" stroke-width="1"/>

  <!-- Figure: Marcus Vance (DP) in profile/angled operating camera -->
  <!-- Shoulders & Dark Shirt -->
  <path d="M 120,400 L 160,250 L 230,220 L 310,230 L 380,280 L 400,400 Z" fill="#18181b" stroke="#334155" stroke-width="2"/>

  <!-- Neck -->
  <rect x="235" y="170" width="45" height="55" fill="#a16207"/>

  <!-- Head & Hair (Short cropped fade) -->
  <ellipse cx="255" cy="135" rx="38" ry="48" fill="#b45309"/>
  <!-- Hair -->
  <path d="M 220,130 C 220,95 285,90 292,125 C 290,105 275,98 255,98 C 235,98 220,110 220,130 Z" fill="#090d16"/>
  
  <!-- Eyes, Eyebrows & Focus concentration looking towards camera -->
  <ellipse cx="236" cy="132" rx="3.5" ry="2" fill="#0f172a"/>
  <line x1="228" y1="125" x2="242" y2="127" stroke="#090d16" stroke-width="2"/>
  <path d="M 230,138 L 225,148 L 232,150" stroke="#92400e" stroke-width="2" fill="none"/>
  <!-- Beard / Stubble -->
  <path d="M 225,152 Q 245,178 270,165 Q 260,182 240,182 Q 225,175 225,152 Z" fill="#451a03" opacity="0.6"/>

  <!-- RED Cinema Camera Rig in Foreground (Handheld / Shoulder Mounted) -->
  <g transform="translate(60, 210)">
    <!-- Carbon Fiber Rods -->
    <rect x="20" y="85" width="160" height="8" rx="3" fill="#334155"/>
    <rect x="20" y="100" width="160" height="8" rx="3" fill="#334155"/>
    <!-- Cinema Camera Body (RED V-Raptor with red accent logo) -->
    <rect x="70" y="30" width="75" height="65" rx="4" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <circle cx="108" cy="62" r="6" fill="#ef4444"/>
    <text x="104" y="66" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff">R</text>
    <!-- Top Handle -->
    <path d="M 80,30 L 80,10 L 140,10 L 140,30" stroke="#475569" stroke-width="4" fill="none"/>
    <!-- Large Matte Box & French Flag -->
    <polygon points="145,18 200,5 200,95 145,82" fill="#020617" stroke="#334155" stroke-width="2"/>
    <rect x="155" y="0" width="45" height="10" rx="1" fill="#1e293b"/>
    <!-- SmallHD On-Camera Monitor with active green focus peaking -->
    <rect x="35" y="0" width="40" height="28" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <rect x="38" y="3" width="34" height="22" fill="#0284c7" opacity="0.9"/>
    <line x1="45" y1="14" x2="65" y2="14" stroke="#4ade80" stroke-width="2"/>
  </g>
</svg>

