<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="crewBg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="vanityBulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#crewBg4)"/>

  <!-- Hollywood Vanity Mirror in Background with warm glowing bulbs -->
  <rect x="70" y="30" width="260" height="230" rx="6" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <rect x="90" y="50" width="220" height="190" fill="#f8fafc" opacity="0.3"/>

  <!-- Vanity Bulbs Glowing around Mirror Frame -->
  <!-- Top Row -->
  <circle cx="95" cy="40" r="12" fill="url(#vanityBulbGlow)"/>
  <circle cx="150" cy="40" r="12" fill="url(#vanityBulbGlow)"/>
  <circle cx="200" cy="40" r="12" fill="url(#vanityBulbGlow)"/>
  <circle cx="250" cy="40" r="12" fill="url(#vanityBulbGlow)"/>
  <circle cx="305" cy="40" r="12" fill="url(#vanityBulbGlow)"/>
  <!-- Left Column -->
  <circle cx="80" cy="95" r="12" fill="url(#vanityBulbGlow)"/>
  <circle cx="80" cy="155" r="12" fill="url(#vanityBulbGlow)"/>
  <circle cx="80" cy="215" r="12" fill="url(#vanityBulbGlow)"/>
  <!-- Right Column -->
  <circle cx="320" cy="95" r="12" fill="url(#vanityBulbGlow)"/>
  <circle cx="320" cy="155" r="12" fill="url(#vanityBulbGlow)"/>
  <circle cx="320" cy="215" r="12" fill="url(#vanityBulbGlow)"/>

  <!-- Professional Figure: Chloe Desroches (Hair & Makeup Dept Head) -->
  <!-- Dark Professional Styling Vest & Blouse -->
  <path d="M 70,400 L 100,260 L 160,225 L 240,225 L 300,260 L 330,400 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
  
  <!-- Neck -->
  <rect x="180" y="170" width="40" height="60" fill="#fcd34d" opacity="0.8"/>

  <!-- Head & Hair (Long styled chestnut/dark hair framing face) -->
  <ellipse cx="200" cy="140" rx="40" ry="50" fill="#fde68a" opacity="0.85"/>
  <!-- Hair framing -->
  <path d="M 150,150 C 145,80 255,80 250,150 C 255,230 235,280 230,280 C 225,240 240,160 235,140 C 220,105 180,105 165,140 C 160,160 175,240 170,280 C 165,280 145,230 150,150 Z" fill="#451a03"/>
  <path d="M 155,115 Q 200,95 245,115 Q 248,70 200,70 Q 152,70 155,115 Z" fill="#451a03"/>

  <!-- Eyes, Brows, Makeup Styling Details -->
  <ellipse cx="185" cy="138" rx="4.5" ry="2.5" fill="#18181b"/>
  <ellipse cx="215" cy="138" rx="4.5" ry="2.5" fill="#18181b"/>
  <line x1="178" y1="128" x2="192" y2="130" stroke="#18181b" stroke-width="2.5"/>
  <line x1="208" y1="130" x2="222" y2="128" stroke="#18181b" stroke-width="2.5"/>
  <path d="M 200,140 L 198,152 L 203,152" stroke="#b45309" stroke-width="2" fill="none"/>
  <!-- Lip color -->
  <path d="M 190,166 Q 200,174 210,166" stroke="#e11d48" stroke-width="3" fill="none"/>

  <!-- Styling Belt with Makeup Brushes in Lower Area -->
  <rect x="110" y="320" width="180" height="35" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <!-- Brushes sticking up from pouch -->
  <line x1="130" y1="320" x2="125" y2="290" stroke="#78350f" stroke-width="4"/>
  <ellipse cx="123" cy="285" rx="5" ry="8" fill="#18181b"/>

  <line x1="150" y1="320" x2="148" y2="280" stroke="#78350f" stroke-width="5"/>
  <ellipse cx="147" cy="275" rx="7" ry="10" fill="#18181b"/>

  <line x1="170" y1="320" x2="173" y2="295" stroke="#78350f" stroke-width="3"/>
  <ellipse cx="174" cy="290" rx="4" ry="7" fill="#18181b"/>
</svg>

