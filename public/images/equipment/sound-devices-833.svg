<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="audioCaseBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#audioCaseBg)"/>

  <!-- Sound Devices 833 8-Channel Mixer in High Detail Center View -->
  <g transform="translate(140, 80)">
    <!-- Heavy Duty Pelican / Peli-Hardcase Foam Border -->
    <rect x="-30" y="-20" width="580" height="380" rx="16" fill="#020617" stroke="#334155" stroke-width="4"/>

    <!-- Mixer Main Aluminum Chassis -->
    <rect x="0" y="0" width="520" height="340" rx="8" fill="#090d16" stroke="#475569" stroke-width="3"/>

    <!-- High-Resolution Daylight Sunlight Readable LCD Screen -->
    <rect x="40" y="30" width="220" height="90" rx="4" fill="#020617" stroke="#334155" stroke-width="2"/>
    <text x="50" y="55" font-family="monospace" font-size="12" font-weight="900" fill="#22c55e">01:42:18:22 TC</text>
    <text x="50" y="75" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">TRACKS 1-8 · 24b/48k</text>
    <text x="50" y="95" font-family="monospace" font-size="10" fill="#e2e8f0">BOOM / LAV 1-4</text>
    <!-- Screen VU Meter Bars -->
    <rect x="180" y="45" width="60" height="4" fill="#22c55e"/>
    <rect x="180" y="55" width="55" height="4" fill="#22c55e"/>
    <rect x="180" y="65" width="65" height="4" fill="#eab308"/>
    <rect x="180" y="75" width="50" height="4" fill="#22c55e"/>
    <rect x="180" y="85" width="70" height="4" fill="#ef4444"/>

    <!-- Sound Devices Logo -->
    <text x="320" y="50" font-family="sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#e2e8f0">SOUND DEVICES</text>
    <text x="320" y="68" font-family="sans-serif" font-size="12" font-weight="800" fill="#dc2626">833</text>

    <!-- 6 Ultra-Low Noise Kashmir Mic Preamps Faders -->
    <g transform="translate(40, 150)">
      <!-- Channel 1 -->
      <circle cx="20" cy="50" r="22" fill="#18181b" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="20" cy="50" r="6" fill="#0284c7"/>
      <text x="14" y="90" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">CH 1</text>

      <!-- Channel 2 -->
      <circle cx="95" cy="50" r="22" fill="#18181b" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="95" cy="50" r="6" fill="#0284c7"/>
      <text x="89" y="90" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">CH 2</text>

      <!-- Channel 3 -->
      <circle cx="170" cy="50" r="22" fill="#18181b" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="170" cy="50" r="6" fill="#0284c7"/>
      <text x="164" y="90" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">CH 3</text>

      <!-- Channel 4 -->
      <circle cx="245" cy="50" r="22" fill="#18181b" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="245" cy="50" r="6" fill="#0284c7"/>
      <text x="239" y="90" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">CH 4</text>

      <!-- Channel 5 -->
      <circle cx="320" cy="50" r="22" fill="#18181b" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="320" cy="50" r="6" fill="#0284c7"/>
      <text x="314" y="90" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">CH 5</text>

      <!-- Channel 6 -->
      <circle cx="395" cy="50" r="22" fill="#18181b" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="395" cy="50" r="6" fill="#0284c7"/>
      <text x="389" y="90" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">CH 6</text>
    </g>

    <!-- Headphone Volume Dial & Transport Controls (Record Red Button) -->
    <g transform="translate(380, 70)">
      <circle cx="90" cy="20" r="14" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
      <circle cx="45" cy="20" r="12" fill="#18181b" stroke="#64748b" stroke-width="1.5"/>
      <polygon points="41,14 52,20 41,26" fill="#22c55e"/>
    </g>

    <!-- Side XLR-3 / TA3 Balanced Audio Connectors -->
    <g transform="translate(-15, 60)">
      <circle cx="0" cy="30" r="12" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="0" cy="70" r="12" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="0" cy="110" r="12" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    </g>
  </g>

  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94a3b8">SOUND DEVICES 833 · 8-CHANNEL 12-TRACK FIELD RECORDER KIT</text>
</svg>

